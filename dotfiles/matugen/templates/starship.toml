"$schema" = 'https://starship.rs/config-schema.json'

# Overall format — left prompt
format = """
[╭─](bold dimmed white)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$nix_shell\
$cmd_duration\
$line_break\
[╰─](bold dimmed white)\
$character"""

# Right prompt
right_format = """
$status\
$jobs\
$time"""

add_newline = true
command_timeout = 1000

# ── OS ──
[os]
disabled = false
format = "[$symbol](bold) "

[os.symbols]
NixOS = "󱄅"
Linux = ""

# ── Username ──
[username]
show_always = false
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style) "
disabled = false

# ── Hostname (only over SSH) ──
[hostname]
ssh_only = true
format = "[@$hostname](bold yellow) "

# ── Directory ──
[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = true
home_symbol = "~"
substitutions = { "/home/bebra" = "~" }

# ── Git ──
[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰏗 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ── Nix shell ──
[nix_shell]
format = 'via [$symbol$state( \($name\))]($style) '
symbol = "󱄅 "
style = "bold blue"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""

# ── Command duration ──
[cmd_duration]
min_time = 2000
format = "⏱ [$duration]($style) "
style = "bold yellow"

# ── Character ──
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# ── Status (right) ──
[status]
disabled = false
format = '[$status]($style) '
style = "bold red"
map_symbol = true

# ── Jobs (right) ──
[jobs]
format = "[$symbol$number]($style) "
symbol = "⚙ "
style = "bold blue"
number_threshold = 1

# ── Time (right) ──
[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "bold dimmed white"

# ── Languages (only show when in project dir) ──
[c]
format = "[$symbol($version(-$name))]($style) "
symbol = " "
style = "bold blue"

[cmake]
format = "[$symbol($version)]($style) "
symbol = "△ "

[python]
format = '[$symbol$pyenv_prefix($version)( \($virtualenv\))]($style) '
symbol = " "

[rust]
format = "[$symbol($version)]($style) "
symbol = " "

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "

[docker_context]
format = "[$symbol$context]($style) "
symbol = " "

palette = "matugen"

[palettes.matugen]
blue = '{{colors.primary.default.hex}}'
cyan = '{{colors.primary.default.hex}}'
purple = '{{colors.tertiary.default.hex}}'
yellow = '{{colors.secondary.default.hex}}'
red = '{{colors.error.default.hex}}'
green = '{{colors.primary.default.hex}}'
