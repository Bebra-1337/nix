name: flake update

on:
  schedule:
    - cron: '0 4 * * *'   # каждый день в 04:00 UTC
  workflow_dispatch:       # или вручную

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: nix flake update
        run: nix flake update --accept-flake-config

      - name: Check if flake.lock changed
        id: lock_changed
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit early if nothing changed
        if: steps.lock_changed.outputs.changed == 'false'
        run: |
          echo "flake.lock не изменился — выходим"
          exit 0

      - name: Build
        if: steps.lock_changed.outputs.changed == 'true'
        # BEBRA-PC-ci = полный default.nix, но без davinci-resolve и ida-pro (requireFile)
        run: nix build .#nixosConfigurations.BEBRA-PC-ci.config.system.build.toplevel --accept-flake-config

      - name: Commit and push
        if: steps.lock_changed.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: flake update $(date -u +%Y-%m-%d)"
          git push
